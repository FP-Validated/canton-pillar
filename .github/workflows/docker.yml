name: docker
on: [push, workflow_dispatch]
jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix:
        service: [api, ledger-command, projection-worker, workflow-orchestrator, webhook-dispatcher, compliance-adapter, reconciler, template-registry, export-worker, usage-meter, search-indexer, migrator, dar-uploader]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fp-validated/pillar-${{ matrix.service }}:${{ github.sha }}
          sbom: true
          provenance: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/fp-validated/pillar-${{ matrix.service }}:${{ github.sha }}
