name: docs
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pillar/api-contracts build
      - run: pnpm --filter @pillar/docs build
      - run: pnpm --filter @pillar/docs check:openapi
      - run: '! grep -RniE "canton internals|secret" apps/docs/dist'
      - uses: actions/upload-artifact@v4
        with: { name: pillar-docs, path: apps/docs/.next }
