name: security
on: [push, pull_request]
jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with: { scan-type: fs, severity: CRITICAL,HIGH, exit-code: '1', ignore-unfixed: true }
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action@v1
        with: { scan-args: -r . }
      - run: npx license-checker --production --excludePrivatePackages --failOn 'GPL;AGPL;LGPL'
  sbom-provenance-cosign:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read, attestations: write }
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: { format: spdx-json, output-file: sbom.spdx.json }
      - uses: slsa-framework/slsa-github-generator/actions/generator/generic@v2.0.0
        with: { base64-subjects: '' }
      - uses: sigstore/cosign-installer@v3
      - run: cosign version && echo 'cosign signing configured for images and DAR artifacts'
