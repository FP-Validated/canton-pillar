{{- if .Values.validatorRegistry.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pillar.fullname" . }}-validator-registry
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pillar.fullname" . }}-validator-registry
subjects:
  - kind: ServiceAccount
    name: {{ include "pillar.fullname" . }}-validator-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pillar.fullname" . }}-validator-registry
{{- end }}
