{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pillar.fullname" . }}-default-deny
  labels:
{{ include "pillar.labels" . | indent 4 }}
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pillar.fullname" . }}-api
  labels:
{{ include "pillar.componentLabels" (dict "root" . "component" "api") | indent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "pillar.selectorLabels" (dict "root" . "component" "api") | indent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ (index .Values "api").port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6865
        - protocol: TCP
          port: 443
---
