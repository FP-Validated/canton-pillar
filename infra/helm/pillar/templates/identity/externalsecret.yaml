{{- if .Values.identity.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pillar.fullname" . }}-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.identity.secretStoreRef.name }}
    kind: {{ .Values.identity.secretStoreRef.kind }}
  target:
    name: {{ include "pillar.fullname" . }}-identity
  data:
    - secretKey: GOOGLE_OAUTH_CLIENT_ID
      remoteRef: { key: {{ .Values.identity.secrets.googleClientId | quote }} }
    - secretKey: GOOGLE_OAUTH_CLIENT_SECRET
      remoteRef: { key: {{ .Values.identity.secrets.googleClientSecret | quote }} }
    - secretKey: PILLAR_SESSION_PEPPER
      remoteRef: { key: {{ .Values.identity.secrets.sessionPepper | quote }} }
{{- end }}
