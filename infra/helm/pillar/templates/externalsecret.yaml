{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "pillar.fullname" . }}-runtime
  labels:
{{ include "pillar.labels" . | indent 4 }}
    app.kubernetes.io/component: externalsecret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "pillar.fullname" . }}-runtime
    creationPolicy: Owner
  data:
  {{- range $key := list "DATABASE_URL" "LEDGER_TOKEN" "LEDGER_MTLS_CERT" "LEDGER_MTLS_KEY" "WEBHOOK_SIGNING_SECRET" "KMS_KEY_REF" "REGISTRY_USERNAME" "REGISTRY_PASSWORD" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.remotePrefix $key | quote }}
  {{- end }}
{{- end }}
