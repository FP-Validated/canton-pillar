apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pillar-dar-upload
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "10"
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-pillar-template-registry
      containers:
        - name: dar-uploader
          image: "{{ .Values.darUpload.image.repository }}:{{ .Values.darUpload.image.tag }}"
          env:
            - name: REGISTRY_UPLOAD_PLAN_ID
              value: {{ required "registry.uploadPlanId is required" .Values.registry.uploadPlanId | quote }}
            - name: REGISTRY_INTERNAL_URL
              value: "http://{{ .Release.Name }}-pillar-template-registry:8087/internal/registry"
          command: ["/bin/sh","-ec"]
          args:
            - |
              dpm --version
              registry-client fetch-plan "$REGISTRY_UPLOAD_PLAN_ID"
              registry-client verify-signature "$REGISTRY_UPLOAD_PLAN_ID"
              registry-client upload-participants "$REGISTRY_UPLOAD_PLAN_ID"
              registry-client assert-compatible "$REGISTRY_UPLOAD_PLAN_ID"
