apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pillar.fullname" . }}-usage-meter
spec:
  replicas: {{ .Values.usageMeter.replicas | default 1 }}
  selector: { matchLabels: { app.kubernetes.io/name: usage-meter } }
  template:
    metadata: { labels: { app.kubernetes.io/name: usage-meter } }
    spec:
      serviceAccountName: {{ include "pillar.fullname" . }}-usage-meter
      containers:
        - name: usage-meter
          image: "{{ .Values.usageMeter.image.repository }}:{{ .Values.usageMeter.image.tag }}"
          envFrom: [{ configMapRef: { name: {{ include "pillar.fullname" . }}-usage-meter } }]
          ports: [{ name: http, containerPort: 8080 }]
