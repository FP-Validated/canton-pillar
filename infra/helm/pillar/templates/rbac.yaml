---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pillar.fullname" . }}-api
  labels:
{{ include "pillar.componentLabels" (dict "root" . "component" "api") | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: [{{ include "pillar.fullname" . }}-config, {{ include "pillar.fullname" . }}-runtime]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pillar.fullname" . }}-api
  labels:
{{ include "pillar.componentLabels" (dict "root" . "component" "api") | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pillar.fullname" . }}-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pillar.fullname" . }}-api
---
