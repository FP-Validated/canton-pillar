{{- $svc := index .Values "docs" -}}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pillar-docs
spec:
  replicas: {{ $svc.replicas }}
  selector: { matchLabels: { app: pillar-docs } }
  template:
    metadata: { labels: { app: pillar-docs } }
    spec:
      serviceAccountName: {{ .Release.Name }}-pillar-docs
      containers:
        - name: docs
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}{{ if $svc.image.digest }}@{{ $svc.image.digest }}{{ end }}"
          ports: [{ containerPort: 3000, name: http }]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-pillar-docs }
{{- end }}
