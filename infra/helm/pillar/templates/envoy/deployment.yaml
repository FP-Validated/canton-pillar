{{- if .Values.envoy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pillar.fullname" . }}-envoy
  labels:
    {{- include "pillar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.envoy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pillar.name" . }}-envoy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pillar.name" . }}-envoy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: envoy
          image: {{ .Values.envoy.image | quote }}
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "pillar.fullname" . }}-envoy
{{- end }}
