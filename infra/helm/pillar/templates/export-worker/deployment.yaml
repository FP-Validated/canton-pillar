apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pillar.fullname" . }}-export-worker
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: export-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: export-worker } }
    spec:
      containers:
        - name: export-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "pillar.fullname" . }}-db, key: url } }
