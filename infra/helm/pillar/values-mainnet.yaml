deploymentMode: hosted
environment: mainnet
release: mainnet
image:
  registryMirror: ""
  pullSecrets: []
config:
  apiBaseUrl: http://localhost:3000/v1
  pillarVersion: 2026-06-30.cedar
  logLevel: info
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: pillar-cluster-secret-store
    kind: ClusterSecretStore
  remotePrefix: /pillar/mainnet
ingress:
  enabled: true
  className: nginx
  host: api.dev.pillar.local
  tlsSecretName: pillar-api-tls
serviceMonitor:
  enabled: true
networkPolicy:
  enabled: true
workloadIdentity:
  annotations: {}
blueGreen:
  enabled: true
  activeColor: blue
canary:
  enabled: true
  weight: 10
migrator:
  image:
    repository: ghcr.io/fp-validated/pillar-migrator
    tag: ""
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
darUpload:
  checksum: sha256:dev-placeholder
  image:
    repository: ghcr.io/fp-validated/pillar-dar-uploader
    tag: ""
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }
api:
  enabled: true
  replicas: 2
  port: 3000
  image:
    repository: ghcr.io/fp-validated/pillar-api
    tag: ""
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
