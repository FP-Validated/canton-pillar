groups:
  - name: pillar-alerts
    rules:
      - alert: PillarApiAvailabilityBurnP0
        expr: pillar:slo_api_availability:ratio_rate5m < 0.95
        for: 5m
        labels: { severity: P0, service: api }
        annotations: { summary: API availability burn, runbook_url: docs/Dev/RUNBOOKS/api-5xx-latency-surge.md }
      - alert: PillarProjectionLagP1
        expr: pillar:slo_projection_freshness:ratio < 0.98
        for: 10m
        labels: { severity: P1, service: projection }
        annotations: { summary: Projection lag exceeded, runbook_url: docs/Dev/RUNBOOKS/projection-rebuild.md }
      - alert: PillarWebhookDeliveryP1
        expr: pillar:slo_webhook_delivery:ratio_rate5m < 0.95
        for: 10m
        labels: { severity: P1, service: webhook }
        annotations: { summary: Webhook delivery failures, runbook_url: docs/Dev/RUNBOOKS/webhook-dlq-drain.md }
      - alert: PillarParticipantUnavailableP0
        expr: pillar_participant_health == 0
        for: 3m
        labels: { severity: P0, service: participant }
        annotations: { summary: Participant unavailable, runbook_url: docs/Dev/RUNBOOKS/participant-unavailable.md }
      - alert: PillarRateLimitSurgeP2
        expr: sum(rate(pillar_api_requests_total{status="429"}[5m])) > 10
        for: 15m
        labels: { severity: P2, service: api }
        annotations: { summary: Rate limit surge, runbook_url: docs/Dev/RUNBOOKS/rate-limit-traffic-surge.md }
