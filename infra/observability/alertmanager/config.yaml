route:
  receiver: digest
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="P0"]
      receiver: pager
      repeat_interval: 15m
    - matchers: [severity="P1"]
      receiver: pager-slack
      repeat_interval: 30m
    - matchers: [severity="P2"]
      receiver: slack
    - matchers: [severity="P3"]
      receiver: digest
inhibit_rules:
  - source_matchers: [severity="P0"]
    target_matchers: [severity=~"P1|P2|P3"]
    equal: [service]
receivers:
  - name: pager
  - name: pager-slack
  - name: slack
  - name: digest
