services:
  redis-streams:
    image: redis:7
    ports: ["6379:6379"]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  api:
    build: ../../apps/api
    environment:
      PILLAR_CACHE_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-postgres://pillar:pillar@postgres:5432/pillar}
    depends_on: [redis]
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    command: ["envoy", "-c", "/etc/envoy/local.envoy.yaml", "--service-cluster", "pillar-local"]
    volumes:
      - ../envoy/local.envoy.yaml:/etc/envoy/local.envoy.yaml:ro
    ports: ["8080:80"]
    depends_on: [api]
  usage-meter:
    build: ../../services/usage-meter
    environment:
      STREAM_BACKEND: redis
      REDIS_URL: redis://redis-streams:6379
    depends_on: [redis-streams]
  validator-registry:
    build: ../../services/validator-registry
    ports: ["8094:8094"]
    environment:
      PORT: "8094"
  billing-adapter:
    build: ../../services/billing-adapter
    environment:
      PROVIDER_ENDPOINT: http://provider.local
