name: pillar-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pillar
      POSTGRES_PASSWORD: pillar
      POSTGRES_DB: pillar
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pillar_pg:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillar -d pillar -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pillar_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  canton-sandbox:
    build:
      context: ../..
      dockerfile: infra/docker/dpm-sandbox.Dockerfile
    image: pillar/dpm-sandbox:local
    environment:
      DAR_PATH: /workspace/pillar.dar
    volumes:
      - ../../daml:/workspace/daml:ro
    ports:
      - "6865:6865"
      - "7575:7575"
    # No healthcheck in P0; sandbox bring-up is informational until P1 ships a DAR.

  webhook-receiver:
    build:
      context: ../..
      dockerfile: infra/docker/webhook-receiver.Dockerfile
      target: local
    image: pillar/webhook-receiver:local
    environment:
      PORT: "9090"
      RECEIVER_MODE: capture
      LOG_LEVEL: info
    ports:
      - "9090:9090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:9090/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: ../..
      dockerfile: infra/docker/migrator.Dockerfile
    image: pillar/migrator:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
    # Stub at P0; real migrations land in P3.

  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    image: pillar/api:local
    profiles: [runtime]
    environment:
      PILLAR_API_AUTH: disabled
      API_BASE_URL: http://localhost:3000/v1
    ports: ["3000:3000"]

  ledger-command:
    build: { context: ../.., dockerfile: infra/docker/ledger-command.Dockerfile }
    image: pillar/ledger-command:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  projection-worker:
    build: { context: ../.., dockerfile: infra/docker/projection-worker.Dockerfile }
    image: pillar/projection-worker:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  workflow-orchestrator:
    build: { context: ../.., dockerfile: infra/docker/workflow-orchestrator.Dockerfile }
    image: pillar/workflow-orchestrator:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  webhook-dispatcher:
    build: { context: ../.., dockerfile: infra/docker/webhook-dispatcher.Dockerfile }
    image: pillar/webhook-dispatcher:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  compliance-adapter:
    build: { context: ../.., dockerfile: infra/docker/compliance-adapter.Dockerfile }
    image: pillar/compliance-adapter:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  reconciler:
    build: { context: ../.., dockerfile: infra/docker/reconciler.Dockerfile }
    image: pillar/reconciler:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  template-registry:
    build: { context: ../.., dockerfile: infra/docker/template-registry.Dockerfile }
    image: pillar/template-registry:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  export-worker:
    build: { context: ../.., dockerfile: infra/docker/export-worker.Dockerfile }
    image: pillar/export-worker:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  usage-meter:
    build: { context: ../.., dockerfile: infra/docker/usage-meter.Dockerfile }
    image: pillar/usage-meter:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  search-indexer:
    build: { context: ../.., dockerfile: infra/docker/search-indexer.Dockerfile }
    image: pillar/search-indexer:local
    profiles: [runtime]
    environment:
      DATABASE_URL: postgres://pillar:pillar@postgres:5432/pillar
      LEDGER_URL: http://canton-sandbox:7575

  otel-collector:
    build:
      context: ../..
      dockerfile: infra/docker/otel-collector.Dockerfile
      target: local
    image: pillar/otel-collector:local
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Collector internal metrics
    # Config copied into image at build time; see infra/observability/otel-collector.yaml.

volumes:
  pillar_pg:
  pillar_redis:
