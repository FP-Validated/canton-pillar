name: pillar-webhook-test

services:
  webhook-receiver:
    build:
      context: ../..
      dockerfile: infra/docker/webhook-receiver.Dockerfile
      target: local
    image: pillar/webhook-receiver:local
    environment:
      PORT: "9090"
      CAPACITY: "500"
      LOG_LEVEL: info
    ports:
      - "9090:9090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:9090/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
