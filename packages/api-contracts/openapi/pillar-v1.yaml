                type: string
              id:
                pattern: ^acct_[A-Za-z0-9_-]{4,80}$
                type: string
              livemode:
                type: boolean
              metadata:
                additionalProperties:
                  type: string
                type: object
              object:
                enum:
                  - account
                type: string
              status:
                enum:
                  - active
                  - restricted
                  - suspended
                  - closed
                type: string
            required:
              - id
              - object
              - created
              - livemode
              - display_name
              - status
              - metadata
            type: object
          type: array
        has_more:
          type: boolean
        object:
          enum:
            - list
          type: string
        url:
          type: string
      required:
        - object
        - url
        - has_more
        - data
